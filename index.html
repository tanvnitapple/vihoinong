const framesFor = (type, bytes) => encodeFrames(type, bytes);

/**
 * Mở camera và quét. mode 'frames' gom các khung AG1 loại `type`; mode 'text' trả về chuỗi đầu tiên
 * mà `accept(text)` chấp nhận. Trả về { el, stop }.
 */
function scanner({ type = null, accept = null, onResult, onCancel }) {
  const video = h('video', { playsinline: true, muted: true, autoplay: true });
  video.muted = true; video.playsInline = true;
  const status = h('p.scan-status', 'Đang mở camera…');
  const work = document.createElement('canvas');
  const collector = type ? new FrameCollector(type) : null;
  let stream = null, stopped = false, timer = null;
  const stop = () => {
    stopped = true; clearTimeout(timer);
    if (stream) stream.getTracks().forEach(t => t.stop());
    video.srcObject = null;
  };
  const tick = async () => {
    if (stopped) return;
    let text = null;
    try { text = await scanVideoFrame(video, work); } catch { text = null; }
    if (stopped) return;
    if (text) {
      if (collector) {
        const r = collector.add(text);
        if (r.error) status.textContent = r.error;
        else if (r.done) { stop(); onResult(r.payload); return; }
        else status.textContent = `Đã nhận ${r.have}/${r.total} phần — giữ yên máy…`;
      } else {
        let value = null;
        try { value = accept(text); } catch (e) { status.textContent = e.message; }
        if (value !== null && value !== undefined) { stop(); onResult(value); return; }
      }
    }
    timer = setTimeout(tick, 90);
  };
  (async () => {
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no-camera');
      stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } });
      if (stopped) { stream.getTracks().forEach(t => t.stop()); return; }
      video.srcObject = stream;
      await video.play().catch(() => {});
      status.textContent = 'Đưa mã QR vào giữa khung';
      tick();
    } catch {
      status.textContent = 'Không mở được camera. Hãy cấp quyền Camera cho ứng dụng rồi thử lại.';
    }
  })();
  const el = h('div.scanner', h('div.viewfinder', video), status,
    h('button.ghost', { type: 'button', onclick: () => { stop(); onCancel(); } }, 'Hủy quét'));
  return { el, stop };
}

/** Lưu file văn bản và cho người dùng CHỌN nơi lưu. Trả về true nếu đã lưu. */
async function saveTextFile(name, text, mime = 'application/json') {
  const native = globalThis.AirGapNative;
  if (native && native.saveFile) {
    return new Promise(resolve => {
      globalThis.__airgapSaveResult = ok => { delete globalThis.__airgapSaveResult; resolve(Boolean(ok)); };
      native.saveFile(name, text);
    });
  }
  if (globalThis.showSaveFilePicker) {
    try {
      const fh = await globalThis.showSaveFilePicker({ suggestedName: name, types: [{ description: 'File của ví', accept: { [mime]: [name.slice(name.lastIndexOf('.'))] } }] });
      const w = await fh.createWritable();
      await w.write(text); await w.close();
      return true;
    } catch (e) { if (e && e.name === 'AbortError') return false; }
  }
  const file = new File([text], name, { type: mime });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    // iOS: bảng chia sẻ có mục "Lưu vào Tệp" để chọn thư mục
    try { await navigator.share({ files: [file] }); return true; } catch (e) { if (e && e.name === 'AbortError') return false; }
  }
  const url = URL.createObjectURL(file);
  const a = h('a', { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  return true;
}

/** Cho người dùng chọn một file và đọc nội dung văn bản (tối đa 64 KB). */

    input.click();
  });
}

const KAT_MNEMONIC = 'test walk nut penalty hip pave soap entry language right filter choice';
const KAT_ADDRESS = 'addr1qx2fxv2umyhttkxyxp8x0dlpdt3k6cwng5pxj3jhsydzer3jcu5d8ps7zex2k2xt3uqxgjqnnj83ws8lhrn648jjxtwqfjkjv7';
const KAT_BLAKE2B_ABC = 'bddd813c634239723171ef3fee98579b94964e3bb1cb3e427262c8c068d52319';

/** @returns {Promise<string|null>} null nếu đạt, hoặc tên bước bị lỗi */
async function selfTest() {
  const step = async (name, fn) => { try { if ((await fn()) !== true) return name; } catch { return name; } return null; };
  let acct, wallet, keys;
  const checks = [
    ['hàm băm BLAKE2b', () => bytesToHex(blake2b(utf8ToBytes('abc'), 32)) === KAT_BLAKE2B_ABC],
    ['dẫn xuất khóa và địa chỉ', async () => {
      acct = await deriveAccountFromEntropy(mnemonicToEntropy(KAT_MNEMONIC));
      wallet = walletFromXpub(acct.accountXpub);
      return wallet.baseAddress === KAT_ADDRESS;
    }],
    ['chữ ký Ed25519', () => {
      keys = deriveSigningKeys(acct.accountXprv);
      const msg = blake2b(utf8ToBytes('tu-kiem-tra'), 32);
      const s = signExtendedEd25519(keys.payXprv, msg);
      const bad = new Uint8Array(s.signature); bad[5] ^= 1;
      return bytesEqual(s.publicKey, wallet.payPub) && verifyEd25519(wallet.payPub, msg, s.signature) && !verifyEd25519(wallet.payPub, msg, bad);
    }],
    ['mã hóa kho khóa', async () => {
      const secret = utf8ToBytes('du-lieu-thu');
      const box = await sealVault(secret, 'mat-khau-tu-kiem-tra', 'selftest');
      const back = await openVault(box, 'mat-khau-tu-kiem-tra');
      let rejected = false;
      try { await openVault(box, 'mat-khau-sai-0000'); } catch { rejected = true; }
      return bytesEqual(back, secret) && rejected;
    }],
    ['dựng và đọc giao dịch', () => {
      const utxos = [{ txHash: 'ab'.repeat(32), index: 0, lovelace: 50000000n, assets: new Map() }];
      const tx = buildUnsignedTx({ wallet, utxos, ttl: 300000000, payment: { addressBytes: parseAddress('addr1vx2fxv2umyhttkxyxp8x0dlpdt3k6cwng5pxj3jhsydzers66hrl8'), lovelace: 7000000n, assets: new Map() } });
      const a = analyzeTxBody(tx.bodyBytes, wallet);
      return a.sent.lovelace === 7000000n && a.external.length === 1 && a.sent.lovelace + a.change.lovelace + a.fee === 50000000n;
    }],
    ['mã QR', () => {
      const frame = encodeFrames('P', wallet.accountXpub)[0];
      const { modules } = generateQrMatrix(frame);
      const text = decodeQrGrid(modules.map(r => Uint8Array.from(r, v => (v ? 1 : 0))));
      const r = new FrameCollector('P').add(text);
      return text === frame && r.done && bytesEqual(r.payload, wallet.accountXpub);
    }]
  ];
  let failed = null;
  for (const [name, fn] of checks) { failed = await step(name, fn); if (failed) break; }
  if (acct) wipe(acct.accountXprv);
  if (keys) wipe(keys.payXprv, keys.stakeXprv);
  return failed;
}

async function call(path, allow404 = false) {
  if (!projectId) throw new Error('Chưa nhập Project ID của Blockfrost');
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 20000);
  try {
    const res = await fetch(API + path, { headers: { project_id: projectId }, signal: ctrl.signal, credentials: 'omit', referrerPolicy: 'no-referrer' });
    if (res.status === 404 && allow404) return null;
    if (!res.ok) throw new Error(explain(res.status, await res.text().catch(() => '')));
    return await res.json();
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Hết thời gian chờ máy chủ. Hãy kiểm tra mạng.');
    if (e instanceof TypeError) throw new Error(`Không kết nối được máy chủ. Hãy kiểm tra mạng. (chi tiết: ${String(e.message).slice(0, 120)})`);
    throw e;
  } finally { clearTimeout(timer); }
}

const big = (v, max = 45000000000000000n) => {
  if (typeof v !== 'string' && typeof v !== 'number') throw new Error('Dữ liệu máy chủ không hợp lệ');
  const s = String(v);
  if (!/^\d{1,20}$/.test(s)) throw new Error('Dữ liệu máy chủ không hợp lệ');
  const n = BigInt(s);
  if (n > max) throw new Error('Dữ liệu máy chủ không hợp lệ');
  return n;
};

async function fetchUtxos(address) {
  if (!/^addr1[0-9a-z]{50,110}$/.test(address)) throw new Error('Địa chỉ ví không hợp lệ');
  const out = [];
  for (let page = 1; page <= 20; page++) {
    const list = await call(`/addresses/${address}/utxos?count=100&page=${page}`, true);
    if (list === null) break;                     // địa chỉ chưa từng nhận tiền
    if (!Array.isArray(list)) throw new Error('Dữ liệu máy chủ không hợp lệ');
    for (const u of list) {
      const txHash = String(u.tx_hash || '').toLowerCase();
      const index = Number(u.output_index ?? u.tx_index);
      if (!/^[0-9a-f]{64}$/.test(txHash) || !Number.isInteger(index) || index < 0 || index > 65535) throw new Error('Dữ liệu máy chủ không hợp lệ');
      if (u.address && u.address !== address) throw new Error('Máy chủ trả về UTXO của địa chỉ khác');
      if (!Array.isArray(u.amount)) throw new Error('Dữ liệu máy chủ không hợp lệ');
      let lovelace = 0n; const assets = new Map();
      for (const a of u.amount) {
        const unit = String(a.unit || '').toLowerCase();
        if (unit === 'lovelace') { lovelace += big(a.quantity); continue; }
        if (unit.length < 56 || unit.length > 120 || unit.length % 2 || !HEX.test(unit)) throw new Error('Dữ liệu máy chủ không hợp lệ');
        const key = `${unit.slice(0, 56)}.${unit.slice(56)}`;
        assets.set(key, (assets.get(key) || 0n) + big(a.quantity, 18446744073709551615n));
      }
      out.push({ txHash, index, lovelace, assets });
    }
    if (list.length < 100) break;
  }
  return out;
}

async function fetchAccount(stakeAddress) {
  if (!/^stake1[0-9a-z]{40,70}$/.test(stakeAddress)) throw new Error('Địa chỉ stake không hợp lệ');
  const a = await call(`/accounts/${stakeAddress}`, true);
  if (!a || typeof a !== 'object') return { registered: false, pool: null, drep: null, rewards: 0n };
  const str = (v, re) => (typeof v === 'string' && re.test(v) ? v : null);
  let drep = str(a.drep_id, /^drep[0-9a-z_]{5,90}$/);
  if (drep && drep.startsWith('drep1')) { try { drep = drepToText(parseDrep(drep)); } catch { /* giữ nguyên */ } }
  return {
    registered: (typeof a.registered === 'boolean' ? a.registered : a.active) === true,
    pool: str(a.pool_id, /^pool1[0-9a-z]{20,80}$/),
    drep,
    rewards: a.withdrawable_amount === null || a.withdrawable_amount === undefined ? 0n : big(a.withdrawable_amount)
  };
}

const NIGHT_UNIT = '0691b2fecca1ac4f53cb6dfb00b7013e561d1f34403b957cbb5af1fa4e49474854';
const txCache = new Map(); // giao dịch đã xác nhận thì không đổi nữa nên giữ lại, đỡ tốn hạn mức Blockfrost

/**
 * Lịch sử giao dịch của địa chỉ (mới nhất trước). Mỗi mục đã tính sẵn số tiền ròng vào/ra của ví,
 * gồm ADA và MỌI loại token (netAssets: khóa `policy.nameHex` → số đơn vị gốc, có dấu).
 * @returns {Promise<{items: Array, more: boolean}>}
 */
async function fetchHistory(address, page = 1, count = 10) {
  if (!/^addr1[0-9a-z]{50,110}$/.test(address)) throw new Error('Địa chỉ ví không hợp lệ');
  const list = await call(`/addresses/${address}/transactions?order=desc&count=${count}&page=${page}`, true);
  if (list === null) return { items: [], more: false };
  if (!Array.isArray(list)) throw new Error('Dữ liệu máy chủ không hợp lệ');
  const sumOf = entries => {
    let lovelace = 0n; const assets = new Map();
    for (const e of entries) for (const a of Array.isArray(e.amount) ? e.amount : []) {
      const unit = String(a.unit || '').toLowerCase();
      if (unit === 'lovelace') { lovelace += big(a.quantity); continue; }
      if (unit.length < 56 || unit.length > 120 || unit.length % 2 || !HEX.test(unit)) throw new Error('Dữ liệu máy chủ không hợp lệ');
      const key = `${unit.slice(0, 56)}.${unit.slice(56)}`;
      assets.set(key, (assets.get(key) || 0n) + big(a.quantity, 18446744073709551615n));
    }
    return { lovelace, assets };
  };
  const addrText = v => (typeof v === 'string' && /^[0-9A-Za-z_]{20,130}$/.test(v) ? v : '(địa chỉ không đọc được)');
  const one = async row => {
    const txHash = String(row.tx_hash || '').toLowerCase();
    if (!/^[0-9a-f]{64}$/.test(txHash)) throw new Error('Dữ liệu máy chủ không hợp lệ');
    const ck = address + '|' + txHash;
    if (txCache.has(ck)) return txCache.get(ck);
    const [u, t] = await Promise.all([call(`/txs/${txHash}/utxos`), call(`/txs/${txHash}`)]);
    if (!u || !Array.isArray(u.inputs) || !Array.isArray(u.outputs) || !t) throw new Error('Dữ liệu máy chủ không hợp lệ');
    const ins = u.inputs.filter(i => !i.collateral && !i.reference), outs = u.outputs.filter(o => !o.collateral);
    const ownIn = ins.filter(i => i.address === address), ownOut = outs.filter(o => o.address === address);
    const external = outs.filter(o => o.address !== address);
    const a = sumOf(ownIn), b = sumOf(ownOut);
    const fee = big(t.fees), deposit = /^-?\d{1,15}$/.test(String(t.deposit)) ? BigInt(t.deposit) : 0n;
    let kind;
    if (ownIn.length === 0) kind = 'receive';
    else if (external.length > 0) kind = 'send';
    else if (Number(t.delegation_count) > 0 || Number(t.stake_cert_count) > 0) kind = 'delegation';
    else if (Number(t.withdrawal_count) > 0) kind = 'withdraw';
    else kind = 'self';
    const parties = kind === 'receive'
      ? [...new Set(ins.map(i => addrText(i.address)))].slice(0, 3).map(address => ({ address }))
      : external.slice(0, 5).map(o => { const v = sumOf([o]); return { address: addrText(o.address), lovelace: v.lovelace, assets: v.assets }; });
    const netAssets = new Map();
    for (const k of new Set([...a.assets.keys(), ...b.assets.keys()])) {
      const d = (b.assets.get(k) || 0n) - (a.assets.get(k) || 0n);
      if (d !== 0n) netAssets.set(k, d);
    }
    const time = Number(row.block_time);
    const item = { txHash, time: Number.isFinite(time) ? time : 0, kind, fee, deposit,
      netLovelace: b.lovelace - a.lovelace, netAssets, parties };
    txCache.set(ck, item);
    return item;
  };
  const items = [];
  for (let i = 0; i < list.length; i += 4) items.push(...await Promise.all(list.slice(i, i + 4).map(one)));
  return { items, more: list.length === count };
}

async function fetchTipAndParams() {
  const tip = await call('/blocks/latest');
  const slot = tip ? Number(tip.slot) : NaN;
  if (!Number.isInteger(slot) || slot < 100000000 || slot > 4000000000) throw new Error('Không đọc được trạng thái mạng');
  let params = DEFAULT_PARAMS;
  try {
    const p = await call('/epochs/latest/parameters');
    if (p) {
      const cand = {
        minFeeA: big(p.min_fee_a), minFeeB: big(p.min_fee_b),
        coinsPerUtxoByte: big(p.coins_per_utxo_size), keyDeposit: big(p.key_deposit)
      };
      // Chỉ nhận tham số trong khoảng hợp lý; ngoài khoảng thì dùng giá trị mặc định
      const sane = cand.minFeeA >= 1n && cand.minFeeA <= 500n && cand.minFeeB <= 2000000n &&
        cand.coinsPerUtxoByte >= 100n && cand.coinsPerUtxoByte <= 50000n && cand.keyDeposit >= 0n && cand.keyDeposit <= 10000000n;
      if (sane) params = cand;
    }
  } catch { /* dùng tham số mặc định */ }
  return { slot, params };
}

async function submitTx(signedTxBytes) {
  if (!projectId) throw new Error('Chưa nhập Project ID của Blockfrost');
  let res;
  try {
    res = await fetch(API + '/tx/submit', {
      method: 'POST', headers: { project_id: projectId, 'Content-Type': 'application/cbor' }, body: signedTxBytes,
      credentials: 'omit', referrerPolicy: 'no-referrer'
    });
  } catch (e) { throw new Error(`Không gửi được lên máy chủ. Giao dịch CHƯA được gửi, có thể thử lại. (chi tiết: ${String(e && e.message).slice(0, 120)})`); }
  const text = (await res.text()).slice(0, 3000);
  if (!res.ok) {
    if (/All inputs are spent|BadInputsUTxO/.test(text)) throw new Error('Số dư của ví đã thay đổi (hoặc giao dịch này đã được gửi rồi). Hãy cập nhật số dư và tạo lại giao dịch.');
    if (/OutsideValidityInterval/.test(text)) throw new Error('Giao dịch đã hết hạn. Hãy tạo lại và ký lại.');
    if (/FeeTooSmall/.test(text)) throw new Error('Phí thấp hơn mức mạng yêu cầu. Hãy cập nhật số dư rồi tạo lại giao dịch.');
    if (/ValueNotConserved/.test(text)) throw new Error('Số dư trên mạng không khớp với lúc tạo giao dịch. Hãy cập nhật số dư và tạo lại.');
    if (/StakeKeyRegistered|StakeKeyAlreadyRegistered|StakeKeyNotRegistered|IncorrectDeposit/.test(text)) throw new Error('Trạng thái đăng ký staking trên mạng khác với dữ liệu ví nhận được. Hãy cập nhật số dư rồi tạo lại giao dịch ủy quyền.');
    if (res.status === 403 || res.status === 402 || res.status === 429 || res.status === 418) throw new Error(explain(res.status, ''));
    throw new Error(`Mạng từ chối giao dịch (${res.status}): ${text.replace(/[^\x20-\x7E]/g, ' ').slice(0, 300)}`);
  }
  return text.replace(/[^0-9a-f]/gi, '').slice(0, 64).toLowerCase();
}

// VÍ NÓNG (iOS, trực tuyến) — chỉ giữ khóa CÔNG KHAI. Xem số dư, dựng giao dịch,
// nhận chữ ký từ ví lạnh qua QR rồi gửi lên mạng. Không thể tự tiêu tiền.

const STORE_KEY = 'adagap.hot.v1';
const KEY_STORE = 'adagap.hot.blockfrost';
const TTL_SECONDS = 3 * 3600; // giao dịch có hiệu lực 3 giờ kể từ lúc tạo

const root = document.getElementById('app');
const MON_KEY = 'adagap.hot.monitor';
const state = { groups: [], activeGroup: 0, key: '', history: null, historyOpen: false, openTx: new Set(), tab: 'wallet', sub: null, wallet: null, data: null, loading: false, error: null, flow: null, cleanup: null,
  all: new Map(),            // xpub của nhóm -> số dư mới nhất của nhóm đó (để xem tất cả nhóm cùng lúc)
  feed: [], unread: 0, feedOpen: false, logFilter: 'all',
  pay: { to: '', lines: [{ asset: 'ADA', amount: '', all: false }] }, stake: { pool: 'keep', poolCustom: '', drep: 'keep', drepCustom: '' } };

// ---------------------------------------------------------------------------
// Ví nóng giữ danh sách NHÓM (mỗi nhóm = một tài khoản của ví lạnh, chỉ có khóa công khai).
const MAX_GROUPS = 20;
const cleanName = v => String(v).replace(/[\u0000-\u001f\u007f]/g, '').trim().slice(0, 24);

function loadGroups() {
  try {
    const r = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    let groups = [], active = 0;
    if (r && r.v === 1 && typeof r.xpub === 'string') groups = [{ xpub: r.xpub, name: 'Ví chính' }];
    else if (r && r.v === 2 && Array.isArray(r.groups)) { groups = r.groups.slice(0, MAX_GROUPS).map(g => ({ xpub: String(g.xpub), name: cleanName(g.name) || 'Nhóm' })); active = Number(r.active) || 0; }
    groups.forEach(g => walletFromXpub(b64ToBytes(g.xpub)));
    state.groups = groups;
    state.activeGroup = active >= 0 && active < groups.length ? active : 0;
  } catch { state.groups = []; state.activeGroup = 0; }
  state.wallet = state.groups.length ? walletFromXpub(b64ToBytes(state.groups[state.activeGroup].xpub)) : null;
}
function persistGroups() {
  if (!state.groups.length) localStorage.removeItem(STORE_KEY);
  else localStorage.setItem(STORE_KEY, JSON.stringify({ v: 2, groups: state.groups, active: state.activeGroup }));
}
function selectGroup(i) {
  state.activeGroup = i;
  state.wallet = state.groups.length ? walletOf(state.groups[i]) : null;
  state.data = state.groups.length ? (state.all.get(state.groups[i].xpub) || null) : null; state.history = null; state.openTx = new Set(); state.error = null;
  persistGroups();
}
/** Nhận mã ghép nối: 64 byte khóa công khai + tên nhóm (UTF-8). Nhóm đã có thì chỉ cập nhật tên. */
function addGroupFromPairing(payload) {
  if (!(payload instanceof Uint8Array) || payload.length < 64 || payload.length > 64 + 96) throw new Error('Mã ghép nối không hợp lệ');
  const xpubBytes = payload.slice(0, 64);
  walletFromXpub(xpubBytes);
  let name = '';
  try { name = cleanName(bytesToUtf8(payload.slice(64))); } catch { name = ''; }
  const xpub = bytesToB64(xpubBytes);
  const at = state.groups.findIndex(g => g.xpub === xpub);
  if (at >= 0) { if (name) state.groups[at].name = name; selectGroup(at); return state.groups[at].name; }
  if (state.groups.length >= MAX_GROUPS) throw new Error(`Tối đa ${MAX_GROUPS} nhóm`);
  state.groups.push({ xpub, name: name || (state.groups.length ? `Nhóm ${state.groups.length + 1}` : 'Ví chính') });
  selectGroup(state.groups.length - 1);
  return state.groups[state.groups.length - 1].name;
}
const walletCache = new Map();
const walletOf = g => { let w = walletCache.get(g.xpub); if (!w) { w = walletFromXpub(b64ToBytes(g.xpub)); walletCache.set(g.xpub, w); } return w; };
const activeGroup = () => state.groups[state.activeGroup] || null;
const groupName = () => (state.groups[state.activeGroup] ? state.groups[state.activeGroup].name : '');

async function refresh() {
  if (state.loading) return;
  if (!state.key) { render(); return; }
  state.loading = true; state.error = null; render();
  try {
    const g = activeGroup();
    const [utxos, account] = await Promise.all([fetchUtxos(state.wallet.baseAddress), fetchAccount(state.wallet.stakeAddress)]);
    record(g, { utxos, account, at: Date.now() });
    state.history = null;
  } catch (e) { state.error = e.message; }
  state.loading = false; render();
  if ((state.historyOpen || state.tab === 'log') && !state.history) loadHistory();
}

// ---------------------------------------------------------------------------
// Số dư của từng nhóm + phát hiện biến động
// ---------------------------------------------------------------------------
function snapshot(d) {
  const m = new Map([['lovelace', 0n]]);
  for (const u of d.utxos) { m.set('lovelace', m.get('lovelace') + u.lovelace); for (const [k, q] of u.assets) m.set(k, (m.get(k) || 0n) + q); }
  m.set('rewards', d.account.rewards);
  return m;
}
function describeChange(prev, next) {
  const out = [];
  for (const k of new Set([...prev.keys(), ...next.keys()])) { const d = (next.get(k) || 0n) - (prev.get(k) || 0n); if (d !== 0n) out.push({ k, d }); }
  return out;
}
function fmtDelta({ k, d }) {
  const a = d < 0n ? -d : d, sign = d < 0n ? '−' : '+';
  if (k === 'lovelace') return `${sign}${formatUnits(a)} ADA`;
  if (k === 'rewards') return `${sign}${formatUnits(a)} ADA thưởng staking`;
  if (k === NIGHT_KEY) return `${sign}${formatUnits(a, NIGHT.decimals)} NIGHT`;
  return `${sign}${a} ${assetLabel(k)}`;
}
/** Lưu số dư mới của một nhóm; nếu khác lần trước thì ghi vào "Biến động" và báo cho người dùng. Trả về true nếu có biến động. */
function record(group, data) {
  data.snap = snapshot(data);
  const prev = state.all.get(group.xpub);
  state.all.set(group.xpub, data);
  const cur = activeGroup();
  if (cur && cur.xpub === group.xpub) state.data = data;
  if (!prev) return false;
  const ch = describeChange(prev.snap, data.snap);
  if (!ch.length) return false;
  const text = ch.map(fmtDelta).join(' · ');
  const main = ch.find(c => c.k !== 'rewards');
  state.feed.unshift({ at: Date.now(), group: group.name, text, up: main ? main.d > 0n : true });
  if (state.feed.length > 30) state.feed.length = 30;
  state.unread += 1;
  if (cur && cur.xpub === group.xpub) state.history = null; // lịch sử cũ không còn đủ
  toast(`«${group.name}»: ${text}`);
  return true;
}

// ---------------------------------------------------------------------------
// Theo dõi số dư trực tuyến: hỏi Blockfrost định kỳ khi ứng dụng đang mở trên màn hình
// ---------------------------------------------------------------------------
const mon = { on: true, timer: null, busy: false, fails: 0, last: 0, error: null };
const monDelay = () => Math.min(Math.max(30000, state.groups.length * 10000) * 2 ** mon.fails, 600000);
function paintMon() {
  const el = document.getElementById('mon-status'); if (!el) return;
  const cls = !mon.on ? 'off' : mon.error ? 'err' : '';
  el.className = 'mon' + (cls ? ' ' + cls : '');
  el.lastChild.textContent = !mon.on ? 'Đã tắt theo dõi tự động'
    : mon.error ? `Theo dõi gặp lỗi: ${mon.error}`
    : mon.last ? `Đang theo dõi · kiểm tra lúc ${new Date(mon.last).toLocaleTimeString('vi-VN')}` : 'Đang theo dõi…';
}
async function pollOnce() {
  if (!mon.on || !state.key || !state.groups.length || document.hidden || state.flow || state.loading || mon.busy) return;
  mon.busy = true;
  let changed = false;
  try {
    for (const g of state.groups.slice()) {
      if (state.flow) break;
      const first = !state.all.has(g.xpub);
      const w = walletOf(g);
      const [utxos, account] = await Promise.all([fetchUtxos(w.baseAddress), fetchAccount(w.stakeAddress)]);
      if (record(g, { utxos, account, at: Date.now() }) || first) changed = true;
    }
    mon.fails = 0; mon.error = null;
  } catch (e) { mon.fails = Math.min(mon.fails + 1, 5); mon.error = e.message; }
  mon.busy = false; mon.last = Date.now();
  if (changed && !state.flow && !state.sub && (state.tab === 'wallet' || state.tab === 'log')) {
    render();
    if ((state.historyOpen || state.tab === 'log') && !state.history) loadHistory();
  } else paintMon();
}
function monSchedule() {
  clearTimeout(mon.timer); mon.timer = null;
  if (!mon.on) return;
  mon.timer = setTimeout(async () => { await pollOnce(); monSchedule(); }, monDelay());
}
function setMonitor(on) {
  mon.on = on; mon.fails = 0; mon.error = null;
  try { localStorage.setItem(MON_KEY, on ? '1' : '0'); } catch { /* không lưu được thì thôi */ }
  monSchedule(); paintMon();
  if (on) pollOnce();
}

function totals(d = state.data) {
  const t = { lovelace: 0n, night: 0n, assets: new Map(), others: 0 };   // assets: mọi token trừ NIGHT
  if (!d) return t;
  for (const u of d.utxos) {
    t.lovelace += u.lovelace;
    for (const [k, q] of u.assets) { if (k === NIGHT_KEY) t.night += q; else t.assets.set(k, (t.assets.get(k) || 0n) + q); }
  }
  t.others = t.assets.size;
  return t;
}

// ---------------------------------------------------------------------------
function render() {
  if (state.cleanup) { try { state.cleanup(); } catch { /* bỏ qua */ } state.cleanup = null; }
  clear(root);
  if (!state.wallet) { root.append(header('Ví nóng'), h('main', viewWelcome())); return; }
  if (state.flow) { root.append(header(state.flow.title), h('main', viewFlow())); return; }
  const titles = { wallet: 'Ví nóng', pay: 'Thanh toán', stake: 'Ủy quyền', log: 'Nhật ký nạp / rút', backup: 'Sao lưu' };
  const body = { wallet: viewWallet, pay: viewPay, stake: viewStake, log: viewLog, backup: viewBackup }[state.tab]();
  root.append(header(titles[state.tab]), h('main', body),
    tabbar([{ id: 'wallet', icon: 'wallet', label: 'Ví' }, { id: 'pay', icon: 'send', label: 'Thanh toán' },
      { id: 'stake', icon: 'stake', label: 'Ủy quyền' }, { id: 'log', icon: 'backup', label: 'Nhật ký' }, { id: 'backup', icon: 'backup', label: 'Sao lưu' }],
      state.tab, id => { state.tab = id; state.sub = null; render(); if (id === 'log' && state.key && state.wallet && !state.history) loadHistory(); }));

async function restoreFromFile() {
  const text = await pickTextFile();
  if (text === null) return;
  let j;
  try { j = JSON.parse(text); } catch { throw new Error('Đây không phải file sao lưu của ví'); }
  if (!j || j.type !== 'adagap-hot-backup') throw new Error('Đây không phải file sao lưu ví nóng');
  let groups;
  if (j.v === 1 && typeof j.xpub === 'string') groups = [{ xpub: j.xpub, name: 'Ví chính' }];
  else if (j.v === 2 && Array.isArray(j.groups) && j.groups.length >= 1 && j.groups.length <= MAX_GROUPS) groups = j.groups.map(g => ({ xpub: String(g && g.xpub), name: cleanName(g && g.name) || 'Nhóm' }));
  else throw new Error('File sao lưu ví nóng sai định dạng');
  groups.forEach(g => walletFromXpub(b64ToBytes(g.xpub)));
  state.all.clear(); state.feed = []; state.unread = 0;
  state.groups = groups; selectGroup(0);
  state.tab = 'wallet'; state.sub = null;
  toast('Đã khôi phục ví nóng.');
  refresh();
}

async function loadHistory(next = false) {
  const hst = state.history || (state.history = { items: [], page: 0, more: true, loading: false, error: null });
  if (hst.loading || (!next && hst.page > 0)) return;
  hst.loading = true; hst.error = null; render();
  try {
    const r = await fetchHistory(state.wallet.baseAddress, hst.page + 1, 10);
    hst.items.push(...r.items); hst.page += 1; hst.more = r.more;
  } catch (e) { hst.error = e.message; }
  hst.loading = false; render();
}

const KIND_LABEL = { receive: 'Nhận', send: 'Gửi đi', delegation: 'Ủy quyền staking', withdraw: 'Rút thưởng', self: 'Ủy quyền / nội bộ ví' };
const unitText = (k, q) => (k === NIGHT_KEY ? `${formatUnits(q, NIGHT.decimals)} NIGHT` : `${q} ${assetLabel(k)}`);

/** Các khoản vào/ra của một giao dịch, tách theo từng loại tài sản: [{k, d}] (d có dấu, k = 'ADA' hoặc khóa token). */
function itemDeltas(it) {
  const out = [];
  if (it.kind === 'send') { const sent = -it.netLovelace - it.fee; if (sent > 0n) out.push({ k: 'ADA', d: -sent }); }
  else if (it.kind === 'receive' || it.kind === 'withdraw') { if (it.netLovelace !== 0n) out.push({ k: 'ADA', d: it.netLovelace }); }
  for (const [k, d] of it.netAssets) out.push({ k, d });
  return out;
}
const deltaText = ({ k, d }) => {
  const a = d < 0n ? -d : d, sign = d < 0n ? '−' : '+';
  return k === 'ADA' ? `${sign}${formatUnits(a)} ADA` : `${sign}${unitText(k, a)}`;
};
function historyAmount(it) {
  const parts = itemDeltas(it).map(deltaText);
  if (it.kind !== 'send' && it.kind !== 'receive' && it.kind !== 'withdraw') parts.push(`Phí ${formatUnits(it.fee)} ADA`);
  return parts.join(' · ') || '0 ADA';
}
const whenText = it => (it.time ? new Date(it.time * 1000).toLocaleString('vi-VN', { dateStyle: 'short', timeStyle: 'short' }) : '');

/** Một dòng giao dịch (thu gọn; bấm mới xổ chi tiết). `label` ghi đè tên loại giao dịch (dùng cho nhật ký nạp/rút). */
function txRow(it, label) {
  const row = h('details.tx' + (it.netLovelace > 0n && it.kind !== 'send' ? '.in' : ''), { open: state.openTx.has(it.txHash) || null },
    h('summary', h('span.tx-kind', label || KIND_LABEL[it.kind]), h('span.tx-amt', historyAmount(it)), h('span.tx-time', whenText(it))),
    h('div.tx-body',
      it.parties.map(pt => h('div.kv.col', h('span', it.kind === 'receive' ? 'Từ địa chỉ' : 'Đến địa chỉ'), h('strong.mono', pt.address),
        it.kind === 'receive' ? null : h('span', [pt.lovelace > 0n ? `${formatUnits(pt.lovelace)} ADA` : null, ...[...pt.assets].map(([k, q]) => unitText(k, q))].filter(Boolean).join(' + ')))),
      it.kind !== 'receive' ? h('div.kv', h('span', 'Phí mạng'), h('strong', `${formatUnits(it.fee)} ADA`)) : null,
      it.deposit !== 0n ? h('div.kv', h('span', it.deposit > 0n ? 'Tiền cọc staking' : 'Hoàn tiền cọc'), h('strong', `${formatUnits(it.deposit < 0n ? -it.deposit : it.deposit)} ADA`)) : null,
      h('div.kv.col', h('span', 'Mã giao dịch'), h('strong.mono', it.txHash)),
      h('a', { href: `https://cardanoscan.io/transaction/${it.txHash}`, target: '_blank', rel: 'noopener noreferrer' }, 'Xem trên Cardanoscan')));
  row.addEventListener('toggle', () => { if (row.open) state.openTx.add(it.txHash); else state.openTx.delete(it.txHash); });
  return row;
}

function historyView() {
  const hst = state.history;
  const box = h('details.fold', { open: state.historyOpen || null }, h('summary', 'Lịch sử giao dịch'));
  box.addEventListener('toggle', () => { state.historyOpen = box.open; if (box.open && !state.history) loadHistory(); });
  if (!hst) return box;
  for (const it of hst.items) box.append(txRow(it));
  if (hst.loading) box.append(h('p.hint', 'Đang tải…'));
  if (hst.error) box.append(h('p.warn', icon('warn'), hst.error));
  if (!hst.loading && !hst.error && hst.page > 0 && hst.items.length === 0) box.append(h('p.hint', 'Chưa có giao dịch nào.'));
  if (!hst.loading && hst.more && hst.page > 0) box.append(h('button.secondary.small', { type: 'button', onclick: () => loadHistory(true) }, 'Xem thêm'));
  if (!hst.loading && hst.error) box.append(h('button.secondary.small', { type: 'button', onclick: () => loadHistory(true) }, 'Thử lại'));
  return box;
}

// ---------------------------------------------------------------------------
// Nhật ký nạp / rút: chỉ những giao dịch có tiền vào hoặc ra khỏi ví (không gồm ủy quyền, giao dịch nội bộ)
// ---------------------------------------------------------------------------
const LOG_KIND = { receive: 'in', send: 'out', withdraw: 'reward' };
const LOG_LABEL = { in: 'Nạp (nhận vào)', out: 'Rút (gửi đi)', reward: 'Thưởng staking' };

function logItems() {
  if (!state.history) return [];
  return state.history.items.filter(it => LOG_KIND[it.kind] && (state.logFilter === 'all' || LOG_KIND[it.kind] === state.logFilter));
}

function logCsv(items) {
  const safe = v => { let t = String(v).replace(/[\r\n]+/g, ' '); if (/^[=+\-@\t]/.test(t)) t = "'" + t; return /[",;]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  const rows = [['Thời gian (UTC)', 'Nhóm', 'Loại', 'ADA', 'Token khác (đơn vị gốc)', 'Phí ADA', 'Đối tác', 'Mã giao dịch']];
  for (const it of items) {
    const d = itemDeltas(it), ada = d.find(x => x.k === 'ADA');
    const adaTxt = ada ? (ada.d < 0n ? '-' : '') + formatUnits(ada.d < 0n ? -ada.d : ada.d).replace(/\./g, '').replace(',', '.') : '0';
    const toks = d.filter(x => x.k !== 'ADA').map(x => `${assetLabel(x.k)}=${x.d}`).join(' ');
    rows.push([it.time ? new Date(it.time * 1000).toISOString().replace('T', ' ').slice(0, 19) : '', groupName(), LOG_LABEL[LOG_KIND[it.kind]], adaTxt, toks,
      it.kind === 'send' ? formatUnits(it.fee).replace(/\./g, '').replace(',', '.') : '', it.parties.map(p => p.address).join(' '), it.txHash]);
  }
  return '﻿' + rows.map(r => r.map(safe).join(',')).join('\r\n') + '\r\n';
}

function viewLog() {
  if (!state.key) return viewKeySetup();
  const hst = state.history, items = logItems();
  const sum = { in: new Map(), out: new Map() };
  for (const it of items) for (const x of itemDeltas(it)) { const m = x.d > 0n ? sum.in : sum.out; m.set(x.k, (m.get(x.k) || 0n) + (x.d < 0n ? -x.d : x.d)); }
  const fmtSum = m => { const l = [...m].sort((a, b) => (a[0] === 'ADA' ? -1 : b[0] === 'ADA' ? 1 : 0)).map(([k, q]) => (k === 'ADA' ? `${formatUnits(q)} ADA` : unitText(k, q))); return l.length ? l.join('\n') : '—'; };
  const chip = (id, label) => h('button' + (state.logFilter === id ? '.active' : ''), { type: 'button', 'aria-pressed': String(state.logFilter === id), onclick: () => { state.logFilter = id; render(); } }, label);
  const out = [
    state.groups.length > 1 ? h('div.field', h('label', 'Nhóm ví'),
      h('select', { 'aria-label': 'Chọn nhóm ví', onchange: e => { selectGroup(Number(e.target.value)); render(); refresh(); } },
        state.groups.map((g, i) => h('option', { value: String(i), selected: i === state.activeGroup || null }, g.name)))) : null,
    h('div.seg.four', { role: 'group', 'aria-label': 'Lọc nhật ký' }, chip('all', 'Tất cả'), chip('in', 'Nạp'), chip('out', 'Rút'), chip('reward', 'Thưởng')),
    h('div.sum2', h('div.in', h('span', 'Tổng nạp / thưởng (đã tải)'), h('strong.pre', fmtSum(sum.in))),
      h('div', h('span', 'Tổng rút (đã tải, chưa gồm phí)'), h('strong.pre', fmtSum(sum.out)))),
    h('p.hint', `Nhóm «${groupName()}». «Nạp» là tiền từ ví khác chuyển vào, «Rút» là tiền bạn gửi đi. Chạm vào từng dòng để xem chi tiết.`)
  ];
  const list = h('section.card.tight');
  let lastDay = '';
  for (const it of items) {
    const day = it.time ? new Date(it.time * 1000).toLocaleDateString('vi-VN', { dateStyle: 'full' }) : 'Không rõ ngày';
    if (day !== lastDay) { list.append(h('div.dayhead', day)); lastDay = day; }
    list.append(txRow(it, LOG_LABEL[LOG_KIND[it.kind]]));
  }
  if (!hst || hst.loading) list.append(h('p.hint', 'Đang tải…'));
  else if (hst.error) list.append(h('p.warn', icon('warn'), hst.error));
  else if (!items.length) list.append(h('p.hint', hst.more ? 'Chưa thấy giao dịch phù hợp trong phần đã tải. Bấm "Xem thêm".' : 'Chưa có giao dịch nạp / rút nào.'));
  out.push(list);
  if (hst && !hst.loading && hst.more && hst.page > 0) out.push(h('button.secondary', { type: 'button', onclick: () => loadHistory(true) }, 'Xem thêm giao dịch cũ hơn'));
  if (hst && !hst.loading && hst.error) out.push(h('button.secondary', { type: 'button', onclick: () => loadHistory(true) }, 'Thử lại'));
  out.push(busyButton('Xuất nhật ký ra file CSV', async () => {
    if (!items.length) throw new Error('Chưa có dòng nào để xuất');
    const name = `nhat-ky-${state.wallet.baseAddress.slice(-6)}-${new Date().toISOString().slice(0, 10)}.csv`;
    if (await saveTextFile(name, logCsv(items), 'text/csv')) toast('Đã lưu file nhật ký.');
  }, 'ghost'));
  return out;
}

const drepLabel = d => ({ drep_always_abstain: 'Luôn bỏ phiếu trắng', drep_always_no_confidence: 'Luôn bất tín nhiệm' }[d] || `${d.slice(0, 14)}…`);

async function startFlow(title, makeArgs) {
  if (!state.key) { state.tab = 'wallet'; state.sub = 'key'; render(); throw new Error('Hãy nhập Project ID của Blockfrost trước'); }
  // Luôn lấy UTXO, tham số và slot mới nhất ngay trước khi dựng
  const [utxos, account, tip] = await Promise.all([
    fetchUtxos(state.wallet.baseAddress), fetchAccount(state.wallet.stakeAddress), fetchTipAndParams()]);
  record(activeGroup(), { utxos, account, at: Date.now() });
  const args = makeArgs({ account, params: tip.params });
  const tx = buildUnsignedTx({ wallet: state.wallet, utxos, params: tip.params, ttl: tip.slot + TTL_SECONDS, ...args });
  // Ví nóng đọc lại giao dịch bằng CHÍNH hàm mà ví lạnh dùng, để hai màn hình hiển thị giống nhau
  const analysis = analyzeTxBody(tx.bodyBytes, state.wallet);
  state.flow = { title, step: 'show', body: tx.bodyBytes, hash: tx.hash, witnessCount: tx.witnessCount, analysis };
  render();
}

function summaryCard(a) {
  const rows = [];
  const tokens = m => [...m].map(([k, q]) => unitText(k, q));
  for (const o of a.external) {
    rows.push(h('div.kv.col', h('span', 'Gửi đến'), h('strong.mono', o.address),
      h('span', [o.lovelace > 0n ? `${formatUnits(o.lovelace)} ADA` : null, ...tokens(o.assets.map(x => [x.key, x.qty]))].filter(Boolean).join(' + '))));
  }
  for (const c of a.certs) {
    if (c.pool) rows.push(h('div.kv.col', h('span', 'Ủy quyền staking cho pool'), h('strong', knownPoolName(c.pool) || 'Pool tự nhập'), h('span.mono', c.pool)));
    if (c.drep) rows.push(h('div.kv.col', h('span', 'Ủy quyền biểu quyết (DRep)'), h('strong', knownDrepName(c.drep) || (c.drep.startsWith('drep1') ? 'DRep tự nhập' : c.drep)), c.drep.startsWith('drep1') ? h('span.mono', c.drep) : null));
    if (c.deposit > 0n) rows.push(h('div.kv', h('span', 'Tiền cọc đăng ký (hoàn lại khi hủy)'), h('strong', `${formatUnits(c.deposit)} ADA`)));
  }
  if (a.withdrawal > 0n) rows.push(h('div.kv', h('span', 'Rút thưởng staking về ví'), h('strong', `+${formatUnits(a.withdrawal)} ADA`)));
  rows.push(h('div.kv', h('span', 'Phí mạng'), h('strong', `${formatUnits(a.fee)} ADA`)));
  rows.push(h('div.kv', h('span', 'Mã đối chiếu'), h('strong', bytesToHex(a.hash).slice(0, 8).toUpperCase())));
  return h('section.card', rows);
}

function flowSteps(active) {
  return h('ol.steps', ['Ví lạnh quét', 'Quét chữ ký', 'Gửi lên mạng'].map((t, i) =>
    h('li' + (i < active ? '.done' : i === active ? '.active' : ''), `${i + 1} · ${t}`)));
}

function viewFlow() {
  const f = state.flow;
  const cancel = h('button.ghost', { type: 'button', onclick: () => { const done = f.step === 'done'; state.flow = null; if (done) refresh(); else render(); } }, f.step === 'done' ? 'Xong' : 'Hủy giao dịch');
  if (f.step === 'show') {
    const view = qrView(framesFor('U', f.body), 'Quét mã này bằng ví lạnh');
    state.cleanup = view.stop;
    return [flowSteps(0), h('section.card', view.el), summaryCard(f.analysis),
      h('p.hint', 'Trên ví lạnh phải hiện đúng địa chỉ, số tiền và mã đối chiếu như trên. Giao dịch hết hạn sau 3 giờ.'),
      h('button.primary', { type: 'button', onclick: () => { f.step = 'scan'; render(); } }, icon('scan'), 'Quét chữ ký từ ví lạnh'), cancel];
  }
  if (f.step === 'scan') {
    const sc = scanner({
      type: 'S',
      onCancel: () => { f.step = 'show'; render(); },
      onResult: payload => {
        try {
          const { hash, witnesses } = unpackSignatures(payload);
          if (!bytesEqual(hash, f.hash)) throw new Error('Chữ ký này thuộc về một giao dịch khác');
          if (witnesses.length !== f.witnessCount) throw new Error('Thiếu chữ ký cần thiết');
          const expected = [state.wallet.payPub, state.wallet.stakePub];
          witnesses.forEach((w, i) => {
            if (!bytesEqual(w.vkey, expected[i]) || !verifyEd25519(expected[i], f.hash, w.sig)) throw new Error(`Chữ ký không khớp với nhóm «${groupName()}». Hãy kiểm tra ví lạnh đang ký đúng nhóm này và đã ghép nối đúng ví.`);
          });
          f.signed = assembleSignedTx(f.body, witnesses);
          f.step = 'confirm';
        } catch (e) { f.step = 'show'; toast(e.message, true); }
        render();
      }
    });
    state.cleanup = sc.stop;
    return [flowSteps(1), sc.el];
  }
  if (f.step === 'confirm') {
    return [flowSteps(2), h('section.card.center', h('span.caps', 'CHỮ KÝ HỢP LỆ'), h('p', 'Giao dịch đã được ví lạnh ký. Bấm gửi để phát lên mạng Cardano.')),
      summaryCard(f.analysis),
      busyButton('Gửi giao dịch lên mạng', async () => {
        const id = await submitTx(f.signed);
        f.txId = id && id.length === 64 ? id : bytesToHex(f.hash);
        f.step = 'done'; state.data = null; state.all.delete(activeGroup().xpub); render();
      }), cancel];
  }
  return [h('section.card.center', h('span.caps', 'ĐÃ GỬI'), h('p', 'Giao dịch đã được mạng tiếp nhận. Số dư sẽ cập nhật sau khoảng 1 phút.'),
    h('p.mono', f.txId),
    h('a', { href: `https://cardanoscan.io/transaction/${f.txId}`, target: '_blank', rel: 'noopener noreferrer' }, 'Xem trên Cardanoscan')), cancel];
}

// Tab Thanh toán
// ---------------------------------------------------------------------------
function extractAddress(text) {
  const m = /(addr1[0-9a-z]{50,120})/.exec(String(text).trim().toLowerCase());
  if (!m) throw new Error('Mã QR không chứa địa chỉ Cardano (addr1…)');
  parseAddress(m[1]);
  return m[1];
}

/** Các tài sản đang có trong ví để chọn khi gửi: ADA, NIGHT và mọi token khác (số đơn vị gốc). */
function payAssets() {
  const t = totals();
  const list = [{ id: 'ADA', label: 'ADA', dec: 6, have: t.lovelace }, { id: NIGHT_KEY, label: 'NIGHT', dec: NIGHT.decimals, have: t.night }];
  for (const [k, q] of [...t.assets].sort((a, b) => (assetLabel(a[0]) < assetLabel(b[0]) ? -1 : 1))) list.push({ id: k, label: assetLabel(k), dec: 0, have: q });
  return list;
}
const fmtHave = (a) => (a.id === 'ADA' ? `${formatUnits(a.have)} ADA` : a.dec ? `${formatUnits(a.have, a.dec)} ${a.label}` : `${a.have} ${a.label} (đơn vị gốc)`);

function viewPay() {
  const p = state.pay;
  if (state.sub === 'scanAddr') {
    const sc = scanner({ accept: extractAddress, onCancel: () => { state.sub = null; render(); },
      onResult: addr => { p.to = addr; state.sub = null; render(); } });
    state.cleanup = sc.stop;
    return [h('section.card', h('h2', 'Quét địa chỉ người nhận')), sc.el];
  }
  const assets = payAssets(), byId = new Map(assets.map(a => [a.id, a]));
  const to = field('Người nhận', { type: 'text', placeholder: 'Dán địa chỉ addr1…', value: p.to });
  to.input.addEventListener('input', () => { p.to = to.input.value; });
  const rows = p.lines.map((ln, i) => {
    const a = byId.get(ln.asset) || assets[0];
    const amount = h('input', { type: 'text', inputmode: 'decimal', placeholder: a.dec ? '0' : 'Số đơn vị gốc', value: ln.amount, 'aria-label': `Số lượng ${a.label}` });
    amount.addEventListener('input', () => { ln.amount = amount.value; ln.all = false; });
    const pick = h('select.asset-pick', { 'aria-label': 'Chọn tài sản' }, assets.map(x => h('option', { value: x.id, selected: x.id === ln.asset || null }, x.label)));
    pick.addEventListener('change', () => { ln.asset = pick.value; ln.amount = ''; ln.all = false; render(); });
    return h('div.tokrow' + (p.lines.length > 1 ? '' : '.solo'), pick,
      p.lines.length > 1 ? h('button.secondary.small', { type: 'button', 'aria-label': 'Bỏ dòng này', onclick: () => { p.lines.splice(i, 1); render(); } }, '✕') : null,
      h('div.inline', amount, h('button.secondary.small', { type: 'button', onclick: () => {
        if (!state.data) return toast('Hãy cập nhật số dư trước.', true);
        if (a.id === 'ADA') { ln.all = true; ln.amount = 'Toàn bộ'; }
        else ln.amount = a.dec ? formatUnits(a.have, a.dec).replace(/\./g, '') : String(a.have);
        render();
      } }, 'Tối đa')),
      h('p.hint', state.data ? `Khả dụng: ${fmtHave(a)}` : 'Chưa tải số dư'));
  });
  const free = assets.filter(a => !p.lines.some(l => l.asset === a.id));
  return [
    h('section.card',
      h('div.field', to.el.firstChild, h('div.inline', to.input,
        h('button.secondary', { type: 'button', 'aria-label': 'Quét QR địa chỉ người nhận', onclick: () => { state.sub = 'scanAddr'; render(); } }, icon('scan'))))),
    h('section', h('h3', p.lines.length > 1 ? `TÀI SẢN SẼ GỬI (${p.lines.length})` : 'TÀI SẢN SẼ GỬI'), h('div.card.tight', rows),
      free.length && p.lines.length < 8 ? h('button.secondary.small', { type: 'button', onclick: () => { p.lines.push({ asset: free[0].id, amount: '', all: false }); render(); } }, '+ Thêm token vào cùng giao dịch') : null),
    p.lines.some(l => l.asset !== 'ADA') ? h('p.hint', 'Khi gửi token, mạng Cardano bắt buộc kèm một lượng ADA tối thiểu (khoảng 1–2 ADA) đi cùng; ví tự thêm. Token khác NIGHT nhập theo số đơn vị gốc, ví lạnh sẽ hiện đúng số đó để bạn đối chiếu.') : null,
    h('div.spacer'),
    busyButton('Tạo mã QR cho ví lạnh', async () => {
      const addressBytes = parseAddress(p.to);
      if (bytesEqual(addressBytes, state.wallet.baseAddressBytes)) throw new Error('Đây là địa chỉ của chính ví này');
      const seen = new Set(); let lovelace = 0n, sendAll = false; const amap = new Map();
      for (const ln of p.lines) {
        if (seen.has(ln.asset)) throw new Error('Mỗi tài sản chỉ được chọn một lần');
        seen.add(ln.asset);
        const a = byId.get(ln.asset);
        if (!a) throw new Error('Ví không có tài sản này');
        if (ln.asset === 'ADA' && ln.all) { sendAll = true; continue; }
        if (ln.asset === 'ADA' && p.lines.length > 1 && !ln.amount.trim()) continue;   // để trống = ví tự thêm ADA tối thiểu
        const units = parseUnits(ln.amount, a.dec);
        if (units <= 0n) throw new Error('Hãy nhập số lượng lớn hơn 0');
        if (units > a.have) throw new Error(`Số dư ${a.label} không đủ`);
        if (ln.asset === 'ADA') lovelace = units; else amap.set(ln.asset, units);
      }
      if (sendAll && amap.size) throw new Error('"Tối đa" ADA không dùng chung với token khác; hãy nhập số ADA cụ thể.');
      const payment = { addressBytes, lovelace: sendAll ? 0n : lovelace, assets: amap, ...(sendAll ? { sendAll: true } : {}) };
      await startFlow(amap.size > 1 || (amap.size && lovelace > 0n) ? 'Gửi nhiều tài sản' : 'Thanh toán', () => ({ payment }));
      state.pay = { to: '', lines: [{ asset: 'ADA', amount: '', all: false }] };
    })
  ];
}

function viewStake() {
  const s = state.stake, acct = state.data ? state.data.account : null;
  const choice = (group, id, title, sub) => h('div.choice' + (s[group] === id ? '.selected' : ''),
    h('div', h('strong', title), sub ? h('span', sub) : null),
    h('button.secondary', { type: 'button', 'aria-pressed': String(s[group] === id), onclick: () => { s[group] = id; render(); } }, s[group] === id ? 'Đã chọn' : 'Chọn'));
  const poolCustom = field('Mã pool (pool1…)', { type: 'text', value: s.poolCustom });
  poolCustom.input.addEventListener('input', () => { s.poolCustom = poolCustom.input.value; });
  const drepCustom = field('Mã DRep (drep1…)', { type: 'text', value: s.drepCustom });
  drepCustom.input.addEventListener('input', () => { s.drepCustom = drepCustom.input.value; });
  const out = [
    h('section', h('div.row', h('h2', 'Staking pool')),
      h('p.hint', `Hiện tại: ${acct ? (acct.pool ? (knownPoolName(acct.pool) || acct.pool.slice(0, 16) + '…') : 'chưa ủy quyền') : 'chưa tải'}`),
      h('div.card',
        choice('pool', 'keep', 'Giữ nguyên'),
        KNOWN_POOLS.map(p => choice('pool', p.id, p.ticker, p.name)),
        choice('pool', 'custom', 'Pool khác', 'Nhập mã pool'),
        s.pool === 'custom' ? poolCustom.el : null)),
    h('section', h('div.row', h('h2', 'DRep (biểu quyết)')),
      h('p.hint', `Hiện tại: ${acct ? (acct.drep ? (knownDrepName(acct.drep) || drepLabel(acct.drep)) : 'chưa ủy quyền') : 'chưa tải'}`),
      h('div.card',
        choice('drep', 'keep', 'Giữ nguyên'),
        KNOWN_DREPS.map(d => choice('drep', d.id, `DRep ${d.name}`, `${d.id.slice(0, 18)}…`)),
        choice('drep', 'abstain', 'Luôn bỏ phiếu trắng', 'Vẫn nhận thưởng staking'),
        choice('drep', 'no_confidence', 'Luôn bất tín nhiệm'),
        choice('drep', 'custom', 'DRep khác', 'Nhập mã DRep'),
        s.drep === 'custom' ? drepCustom.el : null)),
    busyButton('Tạo giao dịch ủy quyền', async () => {
      const poolHash = s.pool === 'keep' ? null : parsePoolId(s.pool === 'custom' ? s.poolCustom : s.pool);
      const drep = s.drep === 'keep' ? null : parseDrep(s.drep === 'custom' ? s.drepCustom : s.drep);
      if (!poolHash && !drep) throw new Error('Hãy chọn pool hoặc DRep muốn ủy quyền');
      await startFlow('Ủy quyền', ({ account, params }) => {
        const c = delegationCert({ stakeHash: state.wallet.stakeHash, poolHash, drep, registered: account.registered, keyDeposit: params.keyDeposit });
        return { certs: [c.cert], deposit: c.deposit };
      });
    }),
    h('p.hint', 'Ủy quyền không chuyển tiền đi đâu cả. Lần đầu cần cọc 2 ADA (được hoàn khi hủy đăng ký). Mỗi lần ủy quyền đều cần ví lạnh ký.')
  ];
  if (acct && acct.rewards > 0n) {
    out.push(h('section.card', h('h2', 'Thưởng staking'), h('p', `Đang có ${formatUnits(acct.rewards)} ADA chờ rút.`),
      busyButton('Rút thưởng về ví', async () => {
        await startFlow('Rút thưởng', ({ account }) => {
          if (account.rewards <= 0n) throw new Error('Không còn thưởng để rút');
          if (!account.drep) throw new Error('Mạng Cardano yêu cầu ủy quyền DRep trước khi rút thưởng. Hãy chọn một DRep ở trên.');
          return { withdrawal: account.rewards };
        });
      }, 'secondary')));
  }
  if (!state.data) out.unshift(busyButton('Tải trạng thái ủy quyền', refresh, 'secondary'));
  return out;
}

function viewBackup() {
  const last = localStorage.getItem('adagap.hot.lastBackup');
  return [
    h('section.card', h('h2', 'Sao lưu ví nóng'),
      h('p', `File chứa khóa công khai của ${state.groups.length} nhóm (không chứa khóa bí mật, không tiêu được tiền). Ai có file này sẽ xem được số dư của bạn. Project ID Blockfrost không nằm trong file.`),
      busyButton('Sao lưu — chọn nơi lưu file', async () => {
        const name = `vi-nong-${state.wallet.baseAddress.slice(-6)}-${new Date().toISOString().slice(0, 10)}.json`;
        const text = JSON.stringify({ type: 'adagap-hot-backup', v: 2, groups: state.groups }, null, 1);
        if (await saveTextFile(name, text)) { localStorage.setItem('adagap.hot.lastBackup', new Date().toISOString()); toast('Đã lưu file sao lưu.'); render(); }
      }),
      h('p.hint', last ? `Lần sao lưu gần nhất: ${new Date(last).toLocaleString('vi-VN')}` : 'Chưa sao lưu lần nào.')),
    h('section.card', h('h2', 'Khôi phục và nhóm'), h('p', 'Khôi phục từ file đã lưu, hoặc ghép nối thêm nhóm bằng mã QR của ví lạnh.'),
      busyButton('Chọn file sao lưu', restoreFromFile, 'secondary'),
      h('button.secondary', { type: 'button', onclick: () => { state.tab = 'wallet'; state.sub = 'pair'; render(); } }, icon('scan'), 'Thêm / ghép nối lại nhóm bằng QR'),
      h('button.ghost', { type: 'button', onclick: () => confirmDialog(`Gỡ nhóm «${groupName()}» khỏi ví nóng? Tiền không bị ảnh hưởng; muốn xem lại chỉ cần ghép nối lại từ ví lạnh.`, 'Gỡ nhóm', () => {
        state.all.delete(state.groups[state.activeGroup].xpub);
        state.groups.splice(state.activeGroup, 1);
        if (state.groups.length) { selectGroup(0); state.tab = 'wallet'; refresh(); }
        else { persistGroups(); state.wallet = null; state.data = null; state.history = null; state.sub = null; render(); }
      }) }, `Gỡ nhóm «${groupName()}»`)),
    h('section.card', h('h2', 'Kết nối mạng'), h('p', state.key ? `Đang dùng Blockfrost, Project ID …${state.key.slice(-4)}` : 'Chưa nhập Project ID của Blockfrost.'),
      h('button.secondary', { type: 'button', onclick: () => { state.tab = 'wallet'; state.sub = 'key'; render(); } }, 'Đổi Project ID Blockfrost'))
  ];
}

// ---------------------------------------------------------------------------
async function boot() {
  if (!globalThis.crypto || !globalThis.crypto.subtle) {
    root.append(h('div.gate', h('h1', 'Cần mở bằng HTTPS'), h('p', 'Ví nóng phải được mở qua địa chỉ https:// (hoặc đã thêm vào Màn hình chính từ địa chỉ https).')));
    return;
  }
  const failed = await selfTest();
  if (failed) {
    root.append(h('div.gate', h('h1', 'Tự kiểm tra không đạt'), h('p', `Bước lỗi: ${failed}. Ví nóng từ chối chạy trên trình duyệt này. Hãy cập nhật iOS/Safari.`)));
    return;
  }
  loadGroups();
  try { const k = localStorage.getItem(KEY_STORE); if (isValidProjectId(k)) { state.key = k; setProjectId(k); } } catch { /* chưa có */ }
  try { mon.on = localStorage.getItem(MON_KEY) !== '0'; } catch { /* mặc định bật */ }
  render();
  if (state.wallet) refresh();
  monSchedule();
  document.addEventListener('visibilitychange', () => { if (!document.hidden && mon.on && Date.now() - mon.last > 15000) pollOnce().then(monSchedule); });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
}
boot();

})();
